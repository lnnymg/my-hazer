<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff1f6">
  <title>A Little Question for You</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="content" id="content">
    <h1>A little question for you…</h1>
    <p>I made something special. Open it when you're ready.</p>
    <div class="envelope" aria-hidden="true">💌</div>
    <button id="openButton" type="button">Open my letter</button>
    <p class="tiny-note">Made with love ♡</p>
  </main>

  <div class="window" id="letterWindow" aria-hidden="true">
    <section class="letter" role="dialog" aria-modal="true" aria-labelledby="letterTitle">
      <button class="close" id="closeButton" type="button" aria-label="Close letter">×</button>
      <h2 id="letterTitle">To my favorite person,</h2>
      <p>
        You make my days brighter, and I love all the little moments we share.
        I feel lucky to have you in my life.
      </p>
      <h2>Will you be my boyfriend?</h2>
      <div class="choices">
        <button id="yesButton" type="button">Yes! 💕</button>
        <button class="secondary" id="thinkButton" type="button">I need a little time</button>
      </div>
      <p id="reply" aria-live="polite"></p>
    </section>
  </div>
</body>
</html>
